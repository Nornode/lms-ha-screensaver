name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua, Perl, and zip tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 perl zip unzip

      - name: Run Lua & Perl test suite
        run: ./scripts/test.sh

      - name: Build applet package
        run: ./scripts/build.sh
